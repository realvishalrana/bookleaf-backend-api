services:
  mysql:
    image: mysql:8.0
    container_name: bookleaf-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: bookleaf
    ports:
      - "3306:3306"
    volumes:
      - bookleaf_mysql_data:/var/lib/mysql

volumes:
  bookleaf_mysql_data:
